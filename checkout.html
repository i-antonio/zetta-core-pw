<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="assets/css/checkout.css">
</head>
<body>

  <h1>Finalizar Compra</h1>

  <div class="page-layout">

    <div class="left-col">

      <!-- Shipping -->
      <div class="card">
        <div class="card-heading">Informações de Entrega</div>

        <div class="row-2" style="margin-bottom:16px;">
          <div class="field">
            <label>Nome</label>
            <input type="text" />
          </div>
          <div class="field">
            <label>Sobrenome</label>
            <input type="text" />
          </div>
        </div>

        <div class="field">
          <label>E-mail</label>
          <input type="email" />
        </div>

        <div class="field">
          <label>Endereço</label>
          <input type="text" />
        </div>

        <div class="row-2">
          <div class="field">
            <label>Cidade</label>
            <input type="text" />
          </div>
          <div class="field">
            <label>CEP</label>
            <input type="text" />
          </div>
        </div>
      </div>

      <!-- Payment -->
      <div class="card">
        <div class="card-heading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          Informações de Pagamento
        </div>

        <div class="field">
          <label>Número do Cartão</label>
          <input type="text" placeholder="1234 5678 9012 3456" />
        </div>

        <div class="row-2" style="margin-bottom:16px;">
          <div class="field">
            <label>Validade</label>
            <input type="text" placeholder="MM/AA" />
          </div>
          <div class="field">
            <label>CVV</label>
            <input type="text" placeholder="123" />
          </div>
        </div>

        <div class="security-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Suas informações de pagamento estão seguras e criptografadas
        </div>
      </div>

    </div>

    <!-- Summary -->
    <div class="summary-card">
      <div class="summary-heading">Resumo do Pedido</div>

      <div class="summary-product">
        <span>Teclado Mecânico RGB × 1</span>
        <span>R$ 349.99</span>
      </div>

      <div class="summary-divider"></div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span>R$ 349.99</span>
      </div>
      <div class="summary-row">
        <span>Frete</span>
        <span>Grátis</span>
      </div>

      <div class="summary-total">
        <span>Total</span>
        <span>R$ 349.99</span>
      </div>

      <button class="btn-pay">Pagar R$ 349.99</button>
    </div>

  </div>

</body>
</html>
