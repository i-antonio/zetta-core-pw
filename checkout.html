<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="assets/css/checkout.css">
</head>
<body>

  <app-header></app-header>

  <main class="container">
    <h1>Finalizar Compra</h1>
  
    <form class="page-layout" id="checkoutForm">
  
      <div class="left-col">
  
        <div class="card">
          <div class="card-heading">Informações de Entrega</div>
  
          <div class="row-2" style="margin-bottom:16px;">
            <div class="field">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" required />
            </div>
            <div class="field">
              <label for="sobrenome">Sobrenome</label>
              <input type="text" id="sobrenome" name="sobrenome" required />
            </div>
          </div>
  
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required />
          </div>
  
          <div class="field">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" required />
          </div>
  
          <div class="row-2">
            <div class="field">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade" required />
            </div>
            <div class="field">
              <label for="cep">CEP</label>
              <input type="text" minlength="8" maxlength="8" id="cep" 
                name="cep" required  oninput="mascaras.cep(event)">
            </div>
          </div>
        </div>
  
        <div class="card">
          <div class="card-heading">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
            Informações de Pagamento
          </div>
  
          <div class="field">
            <label for="numero_cartao">Número do Cartão</label>
            <input type="text" maxlength="16" id="numero_cartao" name="numero_cartao" placeholder="1234 5678 9012 3456" required  oninput="mascaras.numeros(event)" >
          </div>
  
          <div class="row-2" style="margin-bottom:16px;">
            <div class="field">
              <label for="validade_cartao">Validade</label>
              <input type="text" id="validade_cartao" name="validade_cartao" placeholder="MM/AA" required  oninput="mascaras.diaMes(event)">
            </div>
            <div class="field">
              <label for="cvv_cartao">CVV</label>
              <input type="text" id="cvv_cartao" name="cvv_cartao" placeholder="123" required oninput="mascaras.numeros(event)" maxlength="3">
            </div>
          </div>
  
          <div class="security-note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Suas informações de pagamento estão seguras e criptografadas
          </div>
        </div>
      </div>
  
      <div class="summary-card">
        <div class="summary-heading">Resumo do Pedido</div>
  
        <div id="summary-product-list"></div>
  
        <div class="summary-divider"></div>
  
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cartSubtotal">R$ 0,00</span>
        </div>
        <div class="summary-row">
          <span>Frete</span>
          <span>Grátis</span>
        </div>
  
        <div class="summary-total">
          <span>Total</span>
          <span id="cartTotal">R$ 0,00</span>
        </div>
  
        <button class="btn-pay" id="btnPay">Pagar R$ 0,00</button>
      </div>
    </form>
  </main>

  <app-footer></app-footer>
</body>
<script src="assets/js/mascaras.js"></script>
<script type="module" src="assets/js/app.js"></script>
<script>
  const isLoggedIn = Boolean(localStorage.getItem('app_logged_user'));
  if (!isLoggedIn) {
    alert('Faça login para finalizar a compra.');
    window.location.href = 'login.html';
  }
</script>
</html>
