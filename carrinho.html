<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="carrinho.css">
</head>
<body>

    <div class="container">
        <h1 class="page-title">Carrinho de Compras</h1>

        <div class="cart-layout">
            
            <div class="cart-items">
                <div class="cart-item">
                    <img src="https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=150&q=80" alt="Teclado Mecânico RGB" class="item-img">
                    
                    <div class="item-info">
                        <div class="item-text">
                            <h2 class="item-name">Teclado Mecânico RGB</h2>
                            <p class="item-category">Periféricos</p>
                        </div>
                        
                        <div class="qty-control">
                            <button class="qty-btn">&minus;</button>
                            <span class="qty-value">1</span>
                            <button class="qty-btn">&plus;</button>
                        </div>
                    </div>

                    <div class="item-price-action">
                        <span class="item-price">$349.99</span>
                        <button class="remove-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                            Remove
                        </button>
                    </div>
                </div>
            </div>

            <div class="order-summary">
                <h2 class="summary-title">Order Summary</h2>
                
                <div class="summary-line">
                    <span class="summary-label">Subtotal</span>
                    <span class="summary-value">R$ 349.99</span>
                </div>
                <div class="summary-line">
                    <span class="summary-label">Frete</span>
                    <span class="summary-value">Grátis</span>
                </div>
                
                <hr class="summary-divider">
                
                <div class="summary-line summary-total">
                    <span>Total</span>
                    <span>R$ 349.99</span>
                </div>
                
                <button class="btn checkout-btn">Finalizar Compra</button>
                <button class="btn continue-btn">Continuar Comprando</button>
            </div>

        </div>
    </div>

</body>
</html>
