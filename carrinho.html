<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="assets/css/carrinho.css">
</head>
<body>
    <app-header></app-header>
    <div class="container">
        <h1 class="page-title">Carrinho de Compras</h1>
        <div class="cart-layout">
            <div id="cartContainer" class="cart-items"></div>

            <div class="order-summary">
                <h2 class="summary-title">Resumo do Pedido</h2>
                
                <div class="summary-line">
                    <span class="summary-label">Subtotal</span>
                    <span id="cartSubtotal" class="summary-value">R$ 349,99</span>
                </div>
                <div class="summary-line">
                    <span class="summary-label">Frete</span>
                    <span class="summary-value">Grátis</span>
                </div>
                
                <hr class="summary-divider">
                
                <div class="summary-line summary-total">
                    <span>Total</span>
                    <span id="cartTotal"></span>
                </div>
                
                <button class="btn checkout-btn">Finalizar Compra</button>
                <button class="btn continue-btn">Continuar Comprando</button>
            </div>

        </div>
    </div>
    <app-footer></app-footer>
</body>
<script type="module" src="assets/js/app.js"></script>
<script type="module" src="assets/js/compra.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const btnContinue = document.querySelector('.continue-btn');
        if (btnContinue) {
            btnContinue.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        }

        const checkoutBtn = document.querySelector('.checkout-btn');
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', () => {
                window.location.href = 'checkout.html';
            });
        }
    });
</script>
</html>
