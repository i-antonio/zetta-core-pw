<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="assets/css/produto.css">
    <title>Zetta Core - Produto</title>
</head>
<body>
    <nav> </nav>

    <main class="product-container">
        <div class="product-grid">
            <div class="image-section">
                <img id="product-img" src="" alt="">
            </div>

            <div class="info-section">
                <span class="category-tag" id="product-category"></span>
                <h1 id="product-name"></h1>
                <h2 class="price" id="product-price"></h2>
                <p id="product-desc"></p>
                
                <div class="actions">
                    <button class="btn-cart">Adicionar ao Carrinho</button>
                    <button class="btn-buy">Comprar Agora</button>
                </div>
            </div>
        </div>
    </main>
